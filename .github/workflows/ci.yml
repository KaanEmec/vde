# PR gate: the same checks as `make check`, plus vulnerability scanning and
# cross-compilation. Release automation is a separate, later workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "stable"] # the go.mod version and the newest release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true # module and build cache, keyed on go.sum
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test
        # -race needs cgo; only the shipped binaries are built with CGO_ENABLED=0.
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v5
        if: matrix.go == 'stable'
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint # includes staticcheck; configured in .golangci.yml
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1 # installs Go itself; the standard library is scanned too
        with:
          go-version-input: stable
          go-package: ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build linux/amd64 and linux/arm64 with CGO_ENABLED=0
        run: make cross
      - name: Binaries are static
        run: |
          for f in bin/vde-linux-amd64 bin/vde-linux-arm64; do
            test -s "$f"
            file "$f" | grep -q 'statically linked'
          done

  conformance:
    name: conformance (TravelInbox contract v1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Contract §14 items 1-9 against the binary and a fake provider
        run: make conformance
