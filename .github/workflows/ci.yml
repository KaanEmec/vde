# PR gate: the same checks as `make check`, plus vulnerability scanning,
# cross-compilation, the conformance suite and the evaluation harness mechanics. Release
# automation is a separate, later workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "stable"] # the go.mod version and the newest release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true # module and build cache, keyed on go.sum
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test
        # -race needs cgo; only the shipped binaries are built with CGO_ENABLED=0.
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v5
        if: matrix.go == 'stable'
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint # includes staticcheck; configured in .golangci.yml
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1 # installs Go itself; the standard library is scanned too
        with:
          go-version-input: stable
          go-package: ./...

  fuzz:
    name: fuzz (20 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Every fuzz target for a bounded time
        # go test runs one fuzz target per invocation. A failure leaves the input under
        # the package's testdata/fuzz/, uploaded below; add it there as a regression seed.
        run: |
          set -euo pipefail
          for target in \
            "FuzzReadSubmission ./internal/api" \
            "FuzzNew ./internal/document" \
            "FuzzHTMLText ./internal/document" \
            "FuzzParseJSON ./internal/extract" \
            "FuzzParseVerdict ./internal/extract" \
            "FuzzNormalize ./internal/ground" \
            "FuzzOpen ./internal/pdf"; do
            set -- $target
            echo "::group::$1"
            go test -run='^$' -fuzz="^$1\$" -fuzztime=20s "$2"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz/
          retention-days: 14

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build linux/amd64 and linux/arm64 with CGO_ENABLED=0
        run: make cross
      - name: Binaries are static
        run: |
          for f in bin/vde-linux-amd64 bin/vde-linux-arm64; do
            test -s "$f"
            file "$f" | grep -q 'statically linked'
          done

  conformance:
    name: conformance (TravelInbox contract v1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Contract §14 items 1-9 against the binary and a fake provider
        run: make conformance

  eval:
    name: evaluation harness (fake provider, every judge policy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: testdata/eval under always, never and auto
        run: make eval EVAL_OUT="$RUNNER_TEMP/eval-reports"

  storage:
    name: storage backends (PostgreSQL, S3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: vde
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      s3:
        # An S3-compatible store for the blob suite. MinIO no longer publishes images on
        # Docker Hub; RustFS speaks the same API (path-style, SSE-S3 with a master key).
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: minio
          RUSTFS_SECRET_KEY: minio123
          RUSTFS_SSE_S3_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # test-only key
        ports: ["9000:9000"]
    env:
      VDE_TEST_POSTGRES: postgres://postgres:vde@127.0.0.1:5432/postgres?sslmode=disable
      VDE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      VDE_TEST_S3_SSE: AES256
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for the S3 endpoint
        run: |
          for i in $(seq 60); do
            curl -s -o /dev/null "$VDE_TEST_S3_ENDPOINT" && exit 0
            sleep 1
          done
          exit 1
      - name: Store, blob and command suites on PostgreSQL and S3
        run: go test -race -count=1 ./internal/job/... ./internal/blob/... ./cmd/vde/...
