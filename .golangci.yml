version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
  exclusions:
    presets:
      - std-error-handling # unchecked fmt.Fprint*, Close and friends

formatters:
  enable:
    - gofmt
    - goimports
