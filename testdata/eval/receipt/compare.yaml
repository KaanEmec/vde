# compare.yaml of the synthetic receipt cases. Every value not listed is compared exactly.
default: exact
rules:
  - {pointer: /merchant/name, mode: normalized}
  - {pointer: /merchant/address, mode: normalized}
  - {pointer: /items/*/description, mode: normalized}
  - {pointer: /items/*/quantity, mode: numeric, tolerance: 0.001}
  - {pointer: /items/*/unit_price, mode: numeric, tolerance: 0.005}
  - {pointer: /items/*/amount, mode: numeric, tolerance: 0.005}
  - {pointer: /subtotal, mode: numeric, tolerance: 0.005}
  - {pointer: /tax, mode: numeric, tolerance: 0.005}
  - {pointer: /tip, mode: numeric, tolerance: 0.005}
  - {pointer: /total, mode: numeric, tolerance: 0.005}
