# Script format: see the doc comment of package internal/provider/fake. The second YAML
# document is the scenario (input, expect): see TestScenarios in cmd/vde/extract_test.go.
description: the primary extractor model is down; the fallback serves, then the judge accepts
steps:
  - model: primary-model
    repeat: true
    delay: 10ms
    error: {kind: retryable, status: 503}
  - model: fallback-model
    answer: '{"guest": "Jane Example", "nights": 3}'
  - answer: '{"verdict": "accept", "feedback": {}}'
---
input:
  document: examples/samples/booking.txt
expect:
  status: accepted
  attempts: 1
  judge_calls: 1
  extractor_calls: {primary: 1, fallback: 1}
  judge_confidence: null
