  document: examples/samples/booking.txt
  schema: examples/samples/schema.json
  timeout: 1s
expect:
  status: failed
  attempts: 2
  error: timeout
  judge_calls: 1
  extractor_calls: {primary: 2}
  judge_confidence: null
  result: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-02-20", "parties": [{"name": "Jane Example", "role": "guest"}], "total": {"amount": 421.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}]}' # the partial candidate of attempt 1
  feedback:
    - {pointer: /total/amount, message: The document says 412.50., source: judge}
