# Judge policy scenarios (ADR 0009) in the format of testdata/scenarios: see TestScenarios
# in cmd/vde/extract_test.go. schema-convention.json annotates parties critical and their
# role convention: booking.txt prints "Guest" and "Booked by", so the roles "guest" and
# "booked by" are convention copies, while "traveller" and "booker" are not printed.
description: "auto: the judge rejects a convention copy, the extractor answers with the convention's form, and the judge accepts (a candidate answering judge feedback is judged again)"
steps:
  - role: extractor
    answer: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-02-20", "parties": [{"name": "Jane Example", "role": "guest"}, {"name": "Example Travel Desk", "role": "booked by"}], "total": {"amount": 412.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}, {"description": "Breakfast", "quantity": 3, "unit_amount": 15.00, "amount": 45.00}, {"description": "City tax", "quantity": 3, "unit_amount": 2.50, "amount": 7.50}]}'
  - role: judge
    answer: '{"verdict": "reject", "feedback": {"/parties/1/role": "Use one word of your own for the role, not the printed label."}}'
  - role: extractor
    answer: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-02-20", "parties": [{"name": "Jane Example", "role": "traveller"}, {"name": "Example Travel Desk", "role": "booker"}], "total": {"amount": 412.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}, {"description": "Breakfast", "quantity": 3, "unit_amount": 15.00, "amount": 45.00}, {"description": "City tax", "quantity": 3, "unit_amount": 2.50, "amount": 7.50}]}'
  - role: judge
    answer: '{"verdict": "accept", "feedback": {}}'
---
input:
  document: examples/samples/booking.txt
  schema: testdata/scenarios/judge-policy/schema-convention.json
  judge: auto
  sample_rate: 0
expect:
  status: accepted
  verification: judge
  attempts: 2
  extractor_calls: {primary: 2}
  judge_calls: 2
  decision: judged
  disagreements: 0
  feedback_sources: []
