# Judge policy scenarios (ADR 0009): the first YAML document is the fake provider script
# (internal/provider/fake), the second the input and the expected outcome, read by
# TestRun_judgePolicyScenarios in internal/extract. Every scenario runs with
# testdata/scenarios/config/vde.yaml. A candidate's date 2026-04-18 and organiser
# "Grand Gala Events" are invented: booking.txt prints neither.
description: "auto (exit criterion): invented values on the only attempt; no repair, the judge rejects, the job is rejected"
steps:
  - role: extractor
    answer: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-04-18", "parties": [{"name": "Jane Example", "role": "guest"}, {"name": "Grand Gala Events", "role": "organiser"}], "total": {"amount": 412.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}, {"description": "Breakfast", "quantity": 3, "unit_amount": 15.00, "amount": 45.00}, {"description": "City tax", "quantity": 3, "unit_amount": 2.50, "amount": 7.50}]}'
  - role: judge
    answer: '{"verdict": "reject", "feedback": {"/parties/1/role": "The document names the booker, not an organiser."}}'
---
input:
  document: examples/samples/booking.txt
  schema: examples/samples/schema.json
  judge: auto
  sample_rate: 0
  max_attempts: 1
expect:
  status: rejected
  verification: none
  attempts: 1
  extractor_calls: 1
  judge_calls: 1
  decision: judged
  feedback_sources: [judge, grounding, grounding, grounding]
