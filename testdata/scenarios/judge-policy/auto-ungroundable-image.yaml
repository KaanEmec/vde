# Judge policy scenarios (ADR 0009) in the format of testdata/scenarios: see TestScenarios
# in cmd/vde/extract_test.go. A candidate's date 2026-04-18 and organiser
# "Grand Gala Events" are invented: booking.txt prints neither.
description: "auto: a page image has no text to ground against, so the judge is always asked"
steps:
  - role: extractor
    answer: '{"merchant": "a café", "total": {"amount": 9.4, "currency": "EUR"}}'
  - role: judge
    answer: '{"verdict": "accept", "feedback": {}}'
---
input:
  document: examples/samples/receipt.jpg
  judge: auto
  sample_rate: 0
expect:
  status: accepted
  verification: judge
  attempts: 1
  extractor_calls: {primary: 1}
  judge_calls: 1
  decision: judged
  feedback_sources: []
