# Judge policy scenarios (ADR 0009) in the format of testdata/scenarios: see TestScenarios
# in cmd/vde/extract_test.go. schema-convention.json annotates parties critical and their
# role convention: booking.txt prints "Guest" and "Booked by", so the roles "guest" and
# "booked by" are convention copies, while "traveller" and "booker" are not printed.
description: "auto: convention values that are not printed are treated as derived, also inside a critical object, so the candidate is grounded through without a repair or a judge"
steps:
  - role: extractor
    answer: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-02-20", "parties": [{"name": "Jane Example", "role": "traveller"}, {"name": "Example Travel Desk", "role": "booker"}], "total": {"amount": 412.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}, {"description": "Breakfast", "quantity": 3, "unit_amount": 15.00, "amount": 45.00}, {"description": "City tax", "quantity": 3, "unit_amount": 2.50, "amount": 7.50}]}'
---
input:
  document: examples/samples/booking.txt
  schema: testdata/scenarios/judge-policy/schema-convention.json
  judge: auto
  sample_rate: 0
expect:
  status: accepted
  verification: grounded
  attempts: 1
  extractor_calls: {primary: 1}
  judge_calls: 0
  decision: grounded
  feedback_sources: []
