# Judge policy scenarios (ADR 0009) in the format of testdata/scenarios: see TestScenarios
# in cmd/vde/extract_test.go. The candidate's party role "booker" is a derivation:
# booking.txt prints "Booked by", not the word itself.
description: "always, annotated schema: the same derived value is a critical miss, so the one repair is made before the judge is asked"
steps:
  - role: extractor
    repeat: true
    answer: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-02-20", "parties": [{"name": "Jane Example", "role": "guest"}, {"name": "Example Travel Desk", "role": "booker"}], "total": {"amount": 412.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}, {"description": "Breakfast", "quantity": 3, "unit_amount": 15.00, "amount": 45.00}, {"description": "City tax", "quantity": 3, "unit_amount": 2.50, "amount": 7.50}]}'
  - role: judge
    answer: '{"verdict": "accept", "feedback": {}}'
---
input:
  document: examples/samples/booking.txt
  schema: testdata/scenarios/judge-policy/schema-annotated.json
  judge: always
expect:
  status: accepted
  verification: judge
  attempts: 2
  extractor_calls: {primary: 2}
  judge_calls: 1
  decision: judged
  feedback_sources: []
