# Judge policy scenarios (ADR 0009) in the format of testdata/scenarios: see TestScenarios
# in cmd/vde/extract_test.go. A candidate's date 2026-04-18 and organiser
# "Grand Gala Events" are invented: booking.txt prints neither.
description: "auto with sample_rate 1: the grounded candidate is judged anyway; the judge rejects (a disagreement), its feedback drives attempt 2, which it accepts"
steps:
  - role: extractor
    answer: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-02-20", "parties": [{"name": "Jane Example", "role": "guest"}, {"name": "Example Travel Desk", "role": "booked by"}], "total": {"amount": 412.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}, {"description": "Breakfast", "quantity": 3, "unit_amount": 15.00, "amount": 45.00}, {"description": "City tax", "quantity": 3, "unit_amount": 2.50, "amount": 7.50}]}'
  - role: judge
    answer: '{"verdict": "reject", "feedback": {"/parties/1/role": "The document names the booker, not an organiser."}}'
  - role: extractor
    answer: '{"title": "Harbour View Hotel - booking confirmation", "reference": "HV-48213", "date": "2026-02-20", "parties": [{"name": "Jane Example", "role": "guest"}, {"name": "Example Travel Desk", "role": "booked by"}], "total": {"amount": 412.50, "currency": "EUR"}, "line_items": [{"description": "Room", "quantity": 3, "unit_amount": 120.00, "amount": 360.00}, {"description": "Breakfast", "quantity": 3, "unit_amount": 15.00, "amount": 45.00}, {"description": "City tax", "quantity": 3, "unit_amount": 2.50, "amount": 7.50}]}'
  - role: judge
    answer: '{"verdict": "accept", "feedback": {}}'
---
input:
  document: examples/samples/booking.txt
  schema: examples/samples/schema.json
  judge: auto
  sample_rate: 1
expect:
  status: accepted
  verification: judge
  attempts: 2
  extractor_calls: {primary: 2}
  judge_calls: 2
  decision: sampled
  disagreements: 1
  feedback_sources: []
