# Development configuration for the compose example: the examples/vde.dev.yaml setup
# (one provider, one model for both roles, one secret) plus the service settings.
# Reference for every key: docs/operator/configuration.md
#
# `accepts` is YOUR declaration of the media types the model reads natively; vde never
# probes a model. Keep it conservative: a type listed that the model cannot read makes
# jobs fail. The model name was current when this file was written; use one your account
# can call.

server:
  # Inside the container the service must listen on every interface; compose publishes the
  # port on the host's loopback only (see docker-compose.yaml). Requests then arrive over
  # the compose network, not loopback, so plain HTTP needs insecure_http (development
  # only: vde warns at start). For TLS, use the commented caddy service instead: set
  # insecure_http: false and trusted_proxy: true, and drop the published port (README.md,
  # "Reverse proxy with TLS").
  listen: ":8090"
  insecure_http: true
  trusted_proxy: false
  data_dir: /var/lib/vde   # the named volume `vde-data`: database and blobs

endpoints:
  anthropic:
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY   # the NAME of the variable, set from .env by compose
    models:
      claude-sonnet-4-5:
        accepts: [application/pdf, image/png, image/jpeg, image/webp, text/plain, text/html]

groups:
  main:
    endpoints:
      - {endpoint: anthropic, model: claude-sonnet-4-5}

roles:
  extractor: {group: main}
  judge: {group: main}   # the same model checks its own work here; use two models for real use

applications:
  - id: dev-app
    name: Development application
    max_attempts: 3
    quota:
      limit: 1000
      window: P1D
    rate:
      requests_per_minute: 300
      submits_per_minute: 30
      max_in_progress: 20
    retention:
      default: 24h
      force_none: false

# Protect /metrics with a bearer token so it can be scraped from another container or from
# the host. token_env is the NAME of the variable; vde refuses to start if it is unset.
# Uncomment together with the VDE_METRICS_TOKEN line of the vde service (docker-compose.yaml)
# and the value in .env. Without it, /metrics answers only loopback peers, so not the host
# through the published port and not Prometheus.
# metrics:
#   token_env: VDE_METRICS_TOKEN
#
# The admin API (/admin/v1, admin tokens only) listens on 127.0.0.1:8091 inside the
# container by default. To publish it on the host's loopback, set the line below and
# uncomment the 8091 port in docker-compose.yaml (a non-loopback address needs
# insecure_http here, or server.tls). Without it, run the token commands with
# `docker compose exec` (README.md, "Admin API").
# admin:
#   listen: ":8091"
