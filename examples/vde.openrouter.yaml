# OpenRouter through the openai_compatible adapter and its preset.
#
#   export OPENROUTER_API_KEY=...
#   vde config check --config examples/vde.openrouter.yaml
#
# The preset sets base_url to https://openrouter.ai/api/v1, adds attribution headers and
# asks OpenRouter to route only to upstream providers that do not store prompts or train on
# them (provider.data_collection: deny). See docs/providers/openai-compatible.md.
# `accepts` is YOUR declaration of the media types a model reads natively; vde never
# probes a model. Take the list from the provider's current documentation and keep it
# conservative: a type you list that the model cannot read makes jobs fail.
# Reference for every key: docs/operator/configuration.md

endpoints:
  openrouter:
    provider: openai_compatible
    preset: openrouter
    api_key_env: OPENROUTER_API_KEY
    timeout: 120s
    models:
      anthropic/claude-sonnet-4.5:
        # PDFs go as a file part only when application/pdf is listed here; whether the
        # upstream route supports that depends on the model. Drop it to send page images.
        accepts: [application/pdf, image/png, image/jpeg, text/plain, text/html]

groups:
  main:
    endpoints:
      - {endpoint: openrouter, model: anthropic/claude-sonnet-4.5}

roles:
  extractor: {group: main}
  judge: {group: main}
  # When the judge is asked (docs/operator/judge-policy.md): always (the default; contract
  # v1, "accepted" means the judge accepted), never (results end "extracted", no judge) or
  # auto (results whose values the document prints are accepted without a judge, with
  # verification "grounded"; the rest and a 5 % sample go to the judge). For example:
  # judge: {group: main, policy: auto}

# How a PDF reaches models that do not accept application/pdf (docs/operator/pdf.md):
# only used for groups whose models do not read application/pdf. The values below are the defaults.
# documents:
#   pdf:
#     mode: auto                  # auto: text layer if every page has enough text, else rendered pages;
#                                 # text | pages | native (refuse without caller-supplied pages)
#     dpi: 150                    # rendered pages
#     max_pages: 20               # larger PDFs are refused
#     min_text_chars_per_page: 200
#     workers: 1                  # pdfium instances; budget about 500 MB of memory each
