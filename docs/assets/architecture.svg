<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1110" width="800" height="1110" role="img" aria-labelledby="title desc">
  <title id="title">How vde works, end to end</title>
  <desc id="desc">Entry points feed a request into intake; a worker runs the extraction loop (extractor, schema validation, grounding check, judge policy gate, judge) with feedback into the next prompt; model calls go through the router to provider adapters; jobs, blobs and operations sit in a side strip.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8882" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", sans-serif; }
      .bg { fill: #F7F7F5; stroke: #E2E1DC; }
      .n { fill: #FFFFFF; stroke: #C4C2BC; }
      .c { fill: #FAECE7; stroke: #C8826A; }
      .f { fill: #E1F5EE; stroke: #5BA88E; }
      .d { fill: #E8EEF9; stroke: #7C98CC; }
      .grp { fill: #EFEEEA; stroke: #C4C2BC; stroke-dasharray: 5 4; }
      .h1 { font-size: 18px; font-weight: 600; fill: #1F1E1C; }
      .lead { font-size: 12px; fill: #5F5E5A; }
      .h { font-size: 13px; font-weight: 600; fill: #1F1E1C; dominant-baseline: central; }
      .t { font-size: 14px; font-weight: 600; fill: #1F1E1C; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 12px; fill: #5F5E5A; text-anchor: middle; dominant-baseline: central; }
      .ct { fill: #712B13; } .cs { fill: #8F3C1E; }
      .ft { fill: #085041; } .fs { fill: #0F6E56; }
      .dt { fill: #1B3A6B; } .ds { fill: #2D5596; }
      .lbl { font-size: 11px; fill: #5F5E5A; dominant-baseline: central; }
      .end { text-anchor: end; }
      .a { fill: none; stroke: #8A8882; stroke-width: 1.5; }
      .fb { fill: none; stroke: #8A8882; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="799" height="1109" rx="14"/>
  <text class="h1" x="24" y="40">How vde works, end to end</text>
  <text class="lead" x="24" y="62">One document in, one checked JSON object out. Every loop and wait is bounded.</text>

  <!-- Legend -->
  <rect class="c" x="600" y="92" width="14" height="14" rx="3"/>
  <text class="lbl" x="622" y="99">from the caller</text>
  <rect class="f" x="600" y="118" width="14" height="14" rx="3"/>
  <text class="lbl" x="622" y="125">fixed in vde, embedded</text>
  <text class="lbl" x="622" y="141">in the binary</text>
  <rect class="d" x="600" y="160" width="14" height="14" rx="3"/>
  <text class="lbl" x="622" y="167">deterministic,</text>
  <text class="lbl" x="622" y="183">no model call</text>

  <!-- Entry points -->
  <rect class="n" x="24" y="80" width="200" height="52" rx="8"/>
  <text class="t" x="124" y="99">HTTP API</text>
  <text class="s" x="124" y="116">POST /v1/jobs, POST /v1/extract</text>
  <rect class="n" x="240" y="80" width="160" height="52" rx="8"/>
  <text class="t" x="320" y="99">vde extract</text>
  <text class="s" x="320" y="116">CLI, one document</text>
  <rect class="n" x="416" y="80" width="160" height="52" rx="8"/>
  <text class="t" x="496" y="99">vde eval</text>
  <text class="s" x="496" y="116">corpus of cases</text>
  <path class="a" d="M124 132V152" marker-end="url(#arrow)"/>
  <path class="a" d="M320 132V152" marker-end="url(#arrow)"/>
  <path class="a" d="M496 132V152" marker-end="url(#arrow)"/>

  <!-- Caller input -->
  <rect class="c" x="24" y="154" width="552" height="68" rx="8"/>
  <text class="t ct" x="300" y="173">Caller supplies, per request</text>
  <text class="s cs" x="300" y="192">document (PDF, image, HTML, text, email), extractor and judge instructions</text>
  <text class="s cs" x="300" y="208">optional JSON Schema with x-vde-grounding annotations, optional judge policy</text>
  <path class="a" d="M300 222V242" marker-end="url(#arrow)"/>

  <!-- Intake -->
  <rect class="n" x="24" y="244" width="552" height="68" rx="8"/>
  <text class="t" x="300" y="263">Intake</text>
  <text class="s" x="300" y="282">auth, quota and rate limits, idempotency key, schema compiled, job stored</text>
  <text class="s" x="300" y="298">representation: text, HTML or visible text, email, PDF text layer or pages, image</text>
  <path class="a" d="M300 312V338" marker-end="url(#arrow)"/>
  <text class="lbl" x="310" y="326">a worker leases the job</text>

  <!-- Extraction loop -->
  <rect class="grp" x="24" y="340" width="552" height="420" rx="12"/>
  <text class="h" x="40" y="362">Extraction loop <tspan class="lbl">per job, internal/extract</tspan></text>

  <rect class="f" x="40" y="378" width="120" height="50" rx="8"/>
  <text class="t ft" x="100" y="396">Role framings</text>
  <text class="s fs" x="100" y="412">in the binary</text>
  <path class="a" d="M160 403H176" marker-end="url(#arrow)"/>
  <rect class="n" x="178" y="378" width="140" height="50" rx="8"/>
  <text class="t" x="248" y="396">Prompt assembly</text>
  <text class="s" x="248" y="412">framing + caller input</text>
  <path class="a" d="M318 403H344" marker-end="url(#arrow)"/>

  <rect class="n" x="346" y="378" width="194" height="50" rx="8"/>
  <text class="t" x="443" y="396">Extractor</text>
  <text class="s" x="443" y="412">model writes a candidate</text>
  <path class="a" d="M443 428V452" marker-end="url(#arrow)"/>
  <rect class="d" x="346" y="454" width="194" height="50" rx="8"/>
  <text class="t dt" x="443" y="472">Validate</text>
  <text class="s ds" x="443" y="488">JSON Schema, no model</text>
  <path class="a" d="M443 504V528" marker-end="url(#arrow)"/>
  <rect class="d" x="346" y="530" width="194" height="50" rx="8"/>
  <text class="t dt" x="443" y="548">Grounding check</text>
  <text class="s ds" x="443" y="564">values in the document text</text>
  <path class="a" d="M443 580V604" marker-end="url(#arrow)"/>
  <rect class="d" x="346" y="606" width="194" height="50" rx="8"/>
  <text class="t dt" x="443" y="624">Judge policy gate</text>
  <text class="s ds" x="443" y="640">always, auto or never</text>
  <path class="a" d="M443 656V680" marker-end="url(#arrow)"/>
  <rect class="n" x="346" y="682" width="194" height="50" rx="8"/>
  <text class="t" x="443" y="700">Judge</text>
  <text class="s" x="443" y="716">model accepts or rejects</text>

  <!-- Feedback into the next prompt -->
  <path class="fb" d="M346 479H200"/>
  <path class="fb" d="M346 555H200"/>
  <path class="fb" d="M346 707H200"/>
  <path class="fb" d="M200 707V430" marker-end="url(#arrow)"/>
  <text class="lbl" x="210" y="469">schema errors</text>
  <text class="lbl" x="210" y="545">ungrounded: repair once</text>
  <text class="lbl" x="210" y="697">judge rejects</text>
  <text class="lbl" x="40" y="590">Feedback goes into</text>
  <text class="lbl" x="40" y="606">the next prompt, up to</text>
  <text class="lbl" x="40" y="622">the attempt limit and</text>
  <text class="lbl" x="40" y="638">the job deadline. A failed</text>
  <text class="lbl" x="40" y="654">judge call is never</text>
  <text class="lbl" x="40" y="670">acceptance.</text>

  <!-- Gate bypass and result -->
  <path class="a" d="M540 631H558V782" marker-end="url(#arrow)"/>
  <text class="lbl end" x="552" y="746">no judge</text>
  <path class="a" d="M443 732V782" marker-end="url(#arrow)"/>
  <text class="lbl" x="451" y="746">accept</text>
  <rect class="n" x="262" y="784" width="314" height="62" rx="8"/>
  <text class="t" x="419" y="801">Result</text>
  <text class="s" x="419" y="819">accepted (verification: judge or grounded)</text>
  <text class="s" x="419" y="835">or extracted, rejected, failed</text>

  <!-- Router and adapters -->
  <path class="fb" d="M120 760V868" marker-end="url(#arrow)"/>
  <text class="lbl" x="130" y="815">model calls</text>
  <rect class="n" x="24" y="870" width="552" height="52" rx="8"/>
  <text class="t" x="300" y="889">Router</text>
  <text class="s" x="300" y="906">endpoint group per role, ordered failover, bounded tries, escalation</text>
  <path class="a" d="M300 922V942" marker-end="url(#arrow)"/>
  <rect class="grp" x="24" y="944" width="552" height="146" rx="12"/>
  <text class="h" x="40" y="962">Provider adapters</text>
  <rect class="n" x="40" y="976" width="166" height="46" rx="8"/>
  <text class="t" x="123" y="992">Anthropic</text>
  <text class="s" x="123" y="1008">Claude API</text>
  <rect class="n" x="217" y="976" width="166" height="46" rx="8"/>
  <text class="t" x="300" y="992">OpenAI-compatible</text>
  <text class="s" x="300" y="1008">OpenRouter, Ollama, vLLM</text>
  <rect class="n" x="394" y="976" width="166" height="46" rx="8"/>
  <text class="t" x="477" y="992">Gemini</text>
  <text class="s" x="477" y="1008">Google Gemini API</text>
  <rect class="n" x="40" y="1032" width="166" height="46" rx="8"/>
  <text class="t" x="123" y="1048">AWS Bedrock</text>
  <text class="s" x="123" y="1064">Converse API</text>
  <rect class="n" x="217" y="1032" width="166" height="46" rx="8"/>
  <text class="t" x="300" y="1048">Vertex AI</text>
  <text class="s" x="300" y="1064">Gemini and Claude</text>
  <rect class="n" x="394" y="1032" width="166" height="46" rx="8"/>
  <text class="t" x="477" y="1048">Classifier</text>
  <text class="s" x="477" y="1064">judge role only</text>

  <!-- State and operations -->
  <rect class="grp" x="596" y="244" width="180" height="616" rx="12"/>
  <text class="h" x="610" y="264">State and operations</text>
  <path class="a" d="M576 300H608" marker-end="url(#arrow)"/>
  <rect class="n" x="610" y="280" width="152" height="50" rx="8"/>
  <text class="t" x="686" y="298">Job store</text>
  <text class="s" x="686" y="314">SQLite or Postgres</text>
  <rect class="n" x="610" y="366" width="152" height="50" rx="8"/>
  <text class="t" x="686" y="384">Blob store</text>
  <text class="s" x="686" y="400">filesystem or S3</text>
  <rect class="n" x="610" y="452" width="152" height="50" rx="8"/>
  <text class="t" x="686" y="470">Retention sweeper</text>
  <text class="s" x="686" y="486">deletes past expiry</text>
  <rect class="n" x="610" y="538" width="152" height="50" rx="8"/>
  <text class="t" x="686" y="556">Admin API</text>
  <text class="s" x="686" y="572">admin tokens only</text>
  <rect class="n" x="610" y="624" width="152" height="50" rx="8"/>
  <text class="t" x="686" y="642">Metrics and audit</text>
  <text class="s" x="686" y="658">Prometheus, audit log</text>
  <rect class="n" x="610" y="710" width="152" height="50" rx="8"/>
  <text class="t" x="686" y="728">Process roles</text>
  <text class="s" x="686" y="744">api, worker or all</text>
  <path class="a" d="M576 821H608" marker-end="url(#arrow)"/>
  <rect class="n" x="610" y="796" width="152" height="50" rx="8"/>
  <text class="t" x="686" y="814">Webhooks</text>
  <text class="s" x="686" y="830">signed job.finished</text>

</svg>
