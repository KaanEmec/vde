# GoReleaser: static binaries, archives, checksums and the GitHub release notes.
# The container image is built by .github/workflows/release.yml (buildx, multi-arch,
# GHCR), not here, so one Dockerfile serves `make image` and releases alike.
# Signing and SBOMs are v1.0 work (docs/roadmap/v1.0).
version: 2

project_name: vde

before:
  hooks:
    - go mod download

builds:
  - id: vde
    main: ./cmd/vde
    binary: vde
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kaanemec/vde/internal/version.Version={{ .Version }}
      - -X github.com/kaanemec/vde/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/kaanemec/vde/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: vde
    formats: [tar.gz]
    name_template: "vde_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - examples/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  # Commit-message based notes, grouped by conventional prefix; CHANGELOG.md is the
  # hand-written record and is linked from the release body below.
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs?:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge (pull request|branch)'

release:
  github:
    owner: kaanemec
    name: vde
  # A tag with a pre-release suffix (v0.2.0-rc.1) becomes a GitHub pre-release.
  prerelease: auto
  footer: |
    Container image: `ghcr.io/kaanemec/vde:{{ .Version }}`

    Full history: [CHANGELOG.md](https://github.com/kaanemec/vde/blob/{{ .Tag }}/CHANGELOG.md)
